<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  body { width: 280px; margin: 0; padding: 14px; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; color: #0F1A24; }
  h1 { font-size: 15px; margin: 0 0 4px; color: #17385C; }
  p { font-size: 12px; color: #5B6B7C; margin: 4px 0; line-height: 1.6; }
  .status { background: #F3F6FA; border-radius: 8px; padding: 10px; font-size: 12px; margin: 10px 0; }
  button { width: 100%; border: 0; border-radius: 8px; padding: 10px; font-size: 13px; font-weight: 700; background: #17385C; color: #fff; cursor: pointer; font-family: inherit; }
  button.secondary { background: #fff; color: #17385C; border: 1px solid #E4E9F0; margin-top: 8px; }
  .hint { font-size: 11px; color: #98A6B4; margin-top: 10px; line-height: 1.6; }
</style>
</head>
<body>
  <h1>知了 · 门户通知同步</h1>
  <p>门户页面开着时会自动同步</p>
  <div class="status" id="status">读取状态…</div>
  <button id="sync">立即同步当前页</button>
  <button class="secondary" id="open">打开知了</button>
  <div class="hint">只把通知标题和日期发到本机 127.0.0.1:8787，不上传任何服务器。</div>
  <script src="popup.js"></script>
</body>
</html>
